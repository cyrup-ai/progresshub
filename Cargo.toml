[workspace]
members = [
    "packages/cli",
    "packages/client_http",
    "packages/common",
    "packages/config",
    "packages/progress",
    "packages/progresshub",
    "packages/tui",
    "packages/examples/default-cli",
    "packages/examples/custom-display",
]

# Set packages/progresshub as the default package - the SOLE AND ONLY binary in the workspace
default-members = ["packages/progresshub"]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["David Maple <david@cyrup.ai>"]
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/cyrup-ai/progresshub"
keywords = ["encryption", "cryptography", "postquant", "cipher", "security"]
categories = ["cryptography", "authentication"]

[workspace.dependencies]
ystream = { git = "https://github.com/cyrup-ai/ystream", branch = "main" }
lib_bandwydth = { git = "https://github.com/cyrup-ai/bandwydth", branch = "main" }
cryypt = { git = "https://github.com/cyrup-ai/cryypt", branch = "main", package = "cryypt" }
cryypt_key = { git = "https://github.com/cyrup-ai/cryypt", branch = "main", package = "cryypt_key" }
cryypt_jwt = { git = "https://github.com/cyrup-ai/cryypt", branch = "main", package = "cryypt_jwt" }
cryypt_vault = { git = "https://github.com/cyrup-ai/cryypt", branch = "main", package = "cryypt_vault" }




