[package]
name = "progresshub-config"
version = "0.1.0"
edition = "2024"
authors = ["David Maple <david@cyrup.ai>"]
license = "MIT"
description = "Configuration management for progresshub"
repository = "https://github.com/xetdata/progresshub"
readme = "README.md"
keywords = ["config", "configuration", "settings", "environment", "management"]
categories = ["config", "development-tools"]

[dependencies]
# External dependencies
anyhow = "1.0.100"
thiserror = "2.0.16"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"

[lib]
path = "src/lib.rs"
