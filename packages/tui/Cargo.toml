[package]
name = "progresshub-tui"
version = "0.1.0"
edition = "2024"
authors = ["David Maple <david@cyrup.ai>"]
license = "MIT"
description = "TUI interface for ProgressHub model downloader with library support"
repository = "https://github.com/xetdata/progresshub"
readme = "README.md"
keywords = ["huggingface", "downloader", "progress", "tui", "models"]
categories = ["command-line-utilities", "machine-learning", "web-programming"]

[lib]
name = "progresshub_tui"
path = "src/lib.rs"
crate-type = ["lib"]





[dependencies]
# Zero-allocation streaming primitives - for event handling
ystream = { workspace = true }

# External dependencies
cyrup_sugars = { git = "https://github.com/cyrup-ai/cyrup-sugars", branch = "main", features = ["all"] }

# Local dependencies - only config and progress for pure display logic
progresshub-config = { path = "../config" }
progresshub-progress = { path = "../progress" }
# Temporarily commented out to avoid cryypt compilation errors during YStream integration
# lib_bandwydth = { path = "../../../bandwydth" }

# Error handling
anyhow = "1.0.98"
thiserror = "2.0.12"

# Async runtime
tokio = { version = "1.47.1", features = ["full"] }

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"

# TUI argument parsing
clap = { version = "4.5.42", features = ["derive"] }



# Terminal UI
ratatui = "0.30.0-alpha.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tachyonfx = { path = "../../../tachyonfx"}

# Lock-free data structures
dashmap = "6.1.0"
crossbeam = "0.8.4"
arc-swap = "1.7.1"


# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"

# Filesystem operations - keep dirs for basic path operations  
dirs = "6.0.0"

# Concurrency
parking_lot = "0.12.4"
once_cell = "1.21.3"
flume = "0.11.1"

# Utilities
lazy_static = "1.5.0"
regex = "1.11.1"
chrono = { version = "0.4.41", features = ["serde"] }
futures = "0.3.31"
futures-util = "0.3.31"
tokio-stream = "0.1.17"
termcolor = "1.4.1"
im = "15.1.0"
atty = "0.2.14"
term_size = "0.3.2"

[features]
default = ["std"]
std = []
