[package]
name = "progresshub-progress"
version = "0.1.0"
edition = "2024"
authors = ["David Maple <david@cyrup.ai>"]
license = "MIT"
description = "Progress tracking and event system for progresshub"
repository = "https://github.com/xetdata/progresshub"
readme = "README.md"
keywords = ["progress", "tracking", "events", "async", "monitoring"]
categories = ["asynchronous", "development-tools", "api-bindings"]

[dependencies]
# Zero-allocation streaming primitives - replacing flume channels
ystream = { workspace = true }

# External dependencies
cyrup_sugars = { git = "https://github.com/cyrup-ai/cyrup-sugars", branch = "main" }
progresshub-common = { path = "../common" }
progresshub-config = { path = "../config" }
progresshub-client-http = { path = "../client_http" }


# File system utilities
dirs = "6.0.0"

# Immutable data structures
im = { version = "15.1.0", features = ["serde"] }

# Async runtime
tokio = { version = "1.47.1", features = ["full"] }

# Concurrency primitives
parking_lot = "0.12.4"
once_cell = "1.21.3"
# Lock-free data structures  
dashmap = "6.1.0"  # Latest stable (7.0.0-rc2 available but using stable)
crossbeam = "0.8.4"  # Latest stable
crossbeam-channel = "0.5.15"  # Latest stable

# Event system
flume = "0.11.1"

# Stream processing and futures
futures = "0.3.31"
futures-util = "0.3.31"
futures-timer = "3.0.3"
pin-project-lite = "0.2.16"
async-stream = "0.3.6"

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.16"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Logging
tracing = "0.1.41"

# Regular expressions for quantization pattern analysis (moved from client_selector)
regex = "1.11.3"

# HTTP client for manifest fetching
reqwest = { version = "0.12.23", features = ["json", "rustls-tls"] }

# Random number generation for jitter in retry logic
fastrand = "2.3.0"

[dev-dependencies]
tempfile = "3.23.0"

[lib]
path = "src/lib.rs"
name = "progresshub_progress"
