[package]
name = "progresshub-client-http"
version = "0.1.0"
edition = "2024"
authors = ["David Maple <david@cyrup.ai>"]
license = "MIT"
description = "High-performance HTTP client with chunked downloads for progresshub"
repository = "https://github.com/xetdata/progresshub"
readme = "README.md"
keywords = ["http", "download", "parallel", "chunked", "networking"]
categories = ["network-programming", "web-programming", "asynchronous"]

[dependencies]
# Zero-allocation streaming primitives - for streaming downloads
ystream = { git = "https://github.com/cyrup-ai/ystream", branch = "main" }
# MessageChunk trait support for ystream
cyrup_sugars = { git = "https://github.com/cyrup-ai/cyrup-sugars", branch = "main" }

# External dependencies 
bytes = "1.10.1"
futures-core = "0.3.31"
futures-util = "0.3.31"
anyhow = "1.0.98"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7.16"
# reqwest = { version = "0.12.10", features = ["stream", "rustls-tls"] }  # Replaced with quyc HTTP/3
tracing = "0.1.41"
thiserror = "2.0.12"
pin-project = "1.1.10"
quyc = { path = "/Volumes/samsung_t9/quyc/packages/api" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha1 = "0.10.6"
sha2 = "0.10.9"
hex = "0.4.3"
fastrand = "2.3.0"
once_cell = "1.21.3"
regex = "1.11.1"
url = "2.5.4"

# HTTP client implementation with HTTP/1.1 and HTTP/2 support
# cryypt dependencies removed - not used in implementation

# Local dependencies
progresshub-common = { path = "../common" }
progresshub-config = { path = "../config" }
num-traits = "0.2.19"
flume = "0.11.1"

[lib]
path = "src/lib.rs"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["full"] }
tempfile = "3.20.0"
